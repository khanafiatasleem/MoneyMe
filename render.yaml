services:
  # ==============================================================================
  # 1. MoneyMe Backend API (Java 17 / Spring Boot 3 Container)
  # ==============================================================================
  - type: web
    name: moneyme-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moneyme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"

  # ==============================================================================
  # 2. MoneyMe Frontend (React 18 / Vite Single Page Application)
  # ==============================================================================
  - type: web
    name: moneyme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        envVars:
      - key: VITE_API_URL
        value: https://moneyme-backend.onrender.com/api
        fromService:
          type: web
          name: moneyme-backend
          property: host
          value: https://moneyme-backend.onrender.com/api

# ==============================================================================
# 3. Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: moneyme-db
    databaseName: moneyme_db
    user: postgres
    plan: free

