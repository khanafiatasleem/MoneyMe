version: "1"

# ==============================================================================
# 1. Managed PostgreSQL Database (Free Tier)
# ==============================================================================
databases:
  - name: moneyme-db
    databaseName: moneyme_db
    user: postgres
    plan: free

# ==============================================================================
# 2. Services (Backend API & Frontend Static Site)
# ==============================================================================
services:
  # Backend Spring Boot API (Java 17 via multi-stage Docker)
  - type: web
    name: moneyme-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moneyme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"

  # Frontend React SPA (Vite Static Site)
  - type: web
    name: moneyme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://moneyme-backend.onrender.com/api
