# ==============================================================================
# MoneyMe Spring Boot Application Configuration
# ==============================================================================

spring.application.name=moneyme-backend
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moneyme_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security & JWT Configuration
# Note: For production, set JWT_SECRET via environment variable with a 256-bit+ secure key.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Idempotency Configuration (key expiration in minutes)
app.idempotency.ttl-minutes=1440

# Logging
logging.level.com.moneyme=INFO
logging.level.org.springframework.security=WARN

