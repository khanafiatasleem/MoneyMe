# Test profile with H2 in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:moneymetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
